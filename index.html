<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo</title>

<style>
body {
  background:black;
  color:gold;
  text-align:center;
  font-family:Arial;
}

h1 { color:red; }

button {
  padding:15px;
  margin:10px;
  border:none;
  border-radius:10px;
  background:gold;
  width:80%;
  font-size:16px;
}

input {
  padding:10px;
  margin:5px;
}

.hidden { display:none; }
</style>

</head>

<body>

<h1>🎰 Torneo Del Porcodidio</h1>

<div id="home">
<button id="btnPlayers">Giocatori</button>
<button id="btnStart">Nuovo Torneo</button>
<button id="btnPalmares">Palmares</button>
</div>

<div id="players" class="hidden">
<input id="playerInput" placeholder="Nome">
<button id="addPlayer">Aggiungi</button>
<div id="playerList"></div>
<button id="back1">⬅️</button>
</div>

<div id="tournament" class="hidden">
<div id="gameArea"></div>
<button id="finish">Fine</button>
<button id="back2">⬅️</button>
</div>

<div id="palmares" class="hidden">
<div id="palmaresList"></div>
<button id="back3">⬅️</button>
</div>

<script>
window.onload = function(){

let players = JSON.parse(localStorage.getItem("players")||"[]");
let palmares = JSON.parse(localStorage.getItem("palmares")||"[]");

let games = ["UNO","31","Saltacavallo","Fr0cio","Dubito","Las Vegas"];

function show(section){
document.getElementById("home").classList.add("hidden");
document.getElementById("players").classList.add("hidden");
document.getElementById("tournament").classList.add("hidden");
document.getElementById("palmares").classList.add("hidden");

document.getElementById(section).classList.remove("hidden");
}

function renderPlayers(){
let d=document.getElementById("playerList");
d.innerHTML="";
players.forEach(p=>d.innerHTML+=p+"<br>");
}

function renderPalmares(){
let d=document.getElementById("palmaresList");
d.innerHTML="";
palmares.forEach((p,i)=>d.innerHTML+="Torneo "+(i+1)+": "+p+"<br>");
}

document.getElementById("btnPlayers").onclick=function(){
show("players");
renderPlayers();
};

document.getElementById("btnStart").onclick=function(){
show("tournament");

let area=document.getElementById("gameArea");
area.innerHTML="";

games.forEach(g=>{
area.innerHTML+="<h3>"+g+"</h3>";
players.forEach(p=>{
area.innerHTML+=p+" <input id='"+g+p+"' type='number' value='0'><br>";
});
});
};

document.getElementById("btnPalmares").onclick=function(){
show("palmares");
renderPalmares();
};

document.getElementById("addPlayer").onclick=function(){
let n=document.getElementById("playerInput").value;
if(n){
players.push(n);
localStorage.setItem("players",JSON.stringify(players));
renderPlayers();
}
};

document.getElementById("finish").onclick=function(){
let scores={};

players.forEach(p=>scores[p]=0);

games.forEach(g=>{
players.forEach(p=>{
let val=parseInt(document.getElementById(g+p).value)||0;
scores[p]+=val;
});
});

let arr=players.map(p=>({name:p,score:scores[p]}));
arr.sort((a,b)=>b.score-a.score);

let winner=arr[0].name;
palmares.push(winner);
localStorage.setItem("palmares",JSON.stringify(palmares));

alert("Vincitore: "+winner);
show("home");
};

document.getElementById("back1").onclick=function(){show("home");};
document.getElementById("back2").onclick=function(){show("home");};
document.getElementById("back3").onclick=function(){show("home");};

};
</script>

</body>
</html>
